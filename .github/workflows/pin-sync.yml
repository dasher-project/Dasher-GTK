name: Packaging pin sync

# The Flatpak manifest clones the submodules from their own git sources
# with hand-maintained pins; when a submodule bumps and the pin is
# forgotten, the Flatpak leg silently builds a stale dependency against
# the new app code (the v6.0.2 publish failure). This check fails the
# PR the moment the two drift apart.

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - .gitmodules
      - rust-tts-wrapper
      - DasherCore
      - Thirdparty/SDL
      - packaging/flatpak/**
      - Scripts/check-flatpak-pins.py
  workflow_dispatch:

jobs:
  flatpak-pins:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The gitlink SHAs come from the tree; no submodule checkout needed.
          submodules: false

      # The check reads the manifest with PyYAML. The runner image has it
      # for the system python3; install it when an image does not. Without
      # it the check stops with an error and no pin is compared.
      - name: PyYAML for the pin check
        run: |
          python3 -c 'import yaml' 2>/dev/null || { sudo apt-get update && sudo apt-get install -y python3-yaml; }
          python3 -c 'import yaml; print("PyYAML", yaml.__version__)'

      - name: Manifest pins follow the submodules
        run: python3 Scripts/check-flatpak-pins.py
