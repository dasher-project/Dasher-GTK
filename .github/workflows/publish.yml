name: Publish

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  # ─── Flatpak ──────────────────────────────────────────────────────────
  # Two legs: x86_64 native, aarch64 via QEMU/binfmt. flathub serves both
  # runtimes natively, so the only arch-specific bit is the `--arch` flag
  # passed to flatpak-builder and the bundle filename.
  #
  # Packaging legs (this job + appimage below) run on main, tags and manual
  # dispatch only — never on PRs (#60). Measured on a recent run: Flatpak
  # x86_64 ~17 min and Flatpak aarch64 ~3h30 under QEMU, while every PR
  # already gets full code verification from the dedicated workflows
  # (multi-platform builds + ctest in cmake-multi-platform.yml, clang-format,
  # dco, validate-metadata). Building distributable binaries per PR bought
  # packaging-only signal at hours of wall time and heavy queued-runner use.
  # A packaging regression surfaces on the main push that lands it, before
  # any tagged release. workflow_dispatch stays non-blocking so the
  # packaging can be exercised experimentally.
  flatpak:
    name: Flatpak (${{ matrix.arch }})
    runs-on: ubuntu-24.04
    if: github.event_name != 'pull_request'
    # Manual dispatch is advisory except on tags: if someone experiments with
    # the packaging via workflow_dispatch the run must not mark the branch
    # red — but a dispatch against a v* tag feeds the release job, which
    # must never publish from a failed packaging run.
    continue-on-error: ${{ github.event_name == 'workflow_dispatch' && !startsWith(github.ref, 'refs/tags/v') }}
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, aarch64]
    steps:
      - uses: actions/checkout@v4

      # Register binfmt handlers so aarch64 binaries (the SDK's build tools
      # and any generated executables) run transparently under QEMU.
      - name: Setup QEMU (aarch64 leg only)
        if: matrix.arch == 'aarch64'
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Setup Flatpak
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder
          flatpak remote-add --user --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo

      - name: Build Flatpak
        run: |
          git config --global protocol.file.allow always
          # Run outside the repo so the manifest's `type: dir` source (repo
          # root) doesn't recursively copy flatpak-builder's own build/state
          # dirs. Source paths in the manifest resolve relative to the manifest.
          mkdir -p "$RUNNER_TEMP/fb" && cd "$RUNNER_TEMP/fb"
          # --install-deps-from=flathub pulls the runtime, SDK and the
          # rust-stable SDK extension at the versions the manifest's
          # runtime-version resolves to, so the GNOME runtime lives in exactly
          # one place (the manifest) and CI never pins an EOL version by hand.
          flatpak-builder --user --install --force-clean \
            --arch="${{ matrix.arch }}" \
            --install-deps-from=flathub \
            build \
            "$GITHUB_WORKSPACE/packaging/flatpak/org.alternativeinterface.dasher.yaml"

      - name: Export bundle
        run: |
          flatpak build-bundle ~/.local/share/flatpak/repo \
            "Dasher-${{ matrix.arch }}.flatpak" \
            org.alternativeinterface.dasher \
            --arch="${{ matrix.arch }}"

      - name: Upload Flatpak
        uses: actions/upload-artifact@v4
        with:
          name: Dasher-flatpak-${{ matrix.arch }}
          path: Dasher-${{ matrix.arch }}.flatpak

  # ─── AppImage ─────────────────────────────────────────────────────────
  # x86_64 builds natively on the runner; aarch64 builds inside an
  # arm64v8/ubuntu:24.04 container under QEMU so all GTK / gtkmm / libcurl
  # deps resolve as native arm64 packages. Skipped on PRs like flatpak
  # above (#60): the aarch64 leg alone is ~35 min of emulation, and PR
  # verification is fully covered by the code workflows.
  appimage:
    name: AppImage (${{ matrix.arch }})
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    # See flatpak above: dispatch is advisory except on tags, where the
    # release job consumes the artifacts and must not publish failures.
    continue-on-error: ${{ github.event_name == 'workflow_dispatch' && !startsWith(github.ref, 'refs/tags/v') }}
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, aarch64]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup QEMU (aarch64 leg only)
        if: matrix.arch == 'aarch64'
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      # ─── x86_64: build on the runner itself ───────────────────────────
      - name: Install GTK4 (x86_64)
        if: matrix.arch == 'x86_64'
        run: sudo apt-get update && sudo apt-get install -y libgtk-4-dev libgtkmm-4.0-dev

      - name: Install extra build deps
        if: matrix.arch == 'x86_64'
        run: |
          sudo apt-get update
          # libcurl4-openssl-dev backs the analytics HTTP transport; linuxdeploy
          # bundles it into the AppImage. squashfs-tools lets us extract the
          # AppImages without running their static-PIE wrapper (QEMU's binfmt
          # on the aarch64 leg can't exec those wrappers; we unify both legs).
          sudo apt-get install -y libspeechd-dev libclang-dev libcurl4-openssl-dev squashfs-tools python3

      - name: Install Rust toolchain (x86_64)
        if: matrix.arch == 'x86_64'
        uses: dtolnay/rust-toolchain@stable

      - name: Build AppImage (x86_64)
        if: matrix.arch == 'x86_64'
        env:
          ARCH: x86_64
          VERSION: ${{ github.ref_name }}
        run: bash packaging/build-appimage.sh

      # ─── aarch64: build inside a native arm64 container ───────────────
      # Building under emulation is much simpler than cross-compiling: apt
      # gives us arm64 GTK/gtkmm/libcurl directly, and linuxdeploy's own
      # arch detection sees a real arm64 host. We use `docker run` directly
      # (rather than `uses: docker://`) so we control the workspace mount
      # and env propagation; the working dir is `/work` inside the container.
      - name: Build AppImage (aarch64, containerised)
        if: matrix.arch == 'aarch64'
        env:
          DASHER_VERSION: ${{ github.ref_name }}
        run: |
          docker run --rm \
            --platform linux/arm64 \
            -v "$GITHUB_WORKSPACE:/work" \
            -w /work \
            -e DASHER_VERSION \
            arm64v8/ubuntu:24.04 \
            bash -c '
              set -ex
              apt-get update
              DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
                build-essential cmake ninja-build pkg-config git wget curl file ca-certificates \
                squashfs-tools python3 \
                libgtk-4-dev libgtkmm-4.0-dev libspeechd-dev libclang-dev \
                libcurl4-openssl-dev libfuse2t64
              curl --proto "=https" --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
              . "$HOME/.cargo/env"
              ARCH=aarch64 VERSION="${DASHER_VERSION:-0.1.0}" bash packaging/build-appimage.sh
            '

      - name: Upload AppImage
        uses: actions/upload-artifact@v4
        with:
          name: Dasher-AppImage-${{ matrix.arch }}
          path: Dasher-${{ matrix.arch }}.AppImage

  # ─── GitHub Release (tags only) ───────────────────────────────────────
  release:
    name: GitHub Release
    needs: [flatpak, appimage]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Hard gate: never ship packages from a tag whose metainfo release entry
      # is missing (validate-metadata.yml flags these, but it runs as a
      # separate workflow — v0.2.10 shipped with a red validate before this
      # gate existed). Pinned by SHA: this job holds the contents:write token,
      # and the checkout runs before the gate (review finding).
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Verify tag ↔ metainfo consistency
        run: |
          set -e
          tag_version="${GITHUB_REF_NAME#v}"
          meta_version="$(grep -m1 -oP '(?<=<release version=")[^"]+' packaging/org.alternativeinterface.dasher.metainfo.xml)"
          echo "tag: $tag_version  metainfo: $meta_version"
          if [ "$tag_version" != "$meta_version" ]; then
            echo "::error::Tag v$tag_version has no matching metainfo <release> entry (newest: $meta_version). Add the entry, merge, delete and re-push the tag. Scripts/tag-release.sh enforces this locally."
            exit 1
          fi
          # Server-side freshness: our release process tags merged main, so a
          # tag pointing anywhere else is a stale-local-main mistake (the
          # client-side script checks this too, but the server has the last
          # word). Re-fetch with enough history to see origin/main's tip.
          git fetch origin main --quiet
          tip="$(git rev-parse origin/main)"
          tagged="${GITHUB_SHA}"
          echo "tagged: $tagged  origin/main: $tip"
          if [ "$tagged" != "$tip" ]; then
            echo "::error::Tag does not point at origin/main's tip — tagged a stale or non-main revision. Re-tag on current main (Scripts/tag-release.sh --push)."
            exit 1
          fi

      - uses: actions/download-artifact@v4
        name: Dasher-flatpak-x86_64
        with:
          name: Dasher-flatpak-x86_64
          path: release/

      - uses: actions/download-artifact@v4
        with:
          name: Dasher-flatpak-aarch64
          path: release/

      - uses: actions/download-artifact@v4
        with:
          name: Dasher-AppImage-x86_64
          path: release/

      - uses: actions/download-artifact@v4
        with:
          name: Dasher-AppImage-aarch64
          path: release/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release/Dasher-x86_64.flatpak
            release/Dasher-aarch64.flatpak
            release/Dasher-x86_64.AppImage
            release/Dasher-aarch64.AppImage
