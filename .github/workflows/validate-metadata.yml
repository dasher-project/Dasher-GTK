name: Validate packaging metadata

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history + tags so the version drift check can git-describe.
          fetch-depth: 0

      - name: Install validators
        run: sudo apt-get update && sudo apt-get install -y desktop-file-utils appstream

      - name: Validate desktop entry
        run: desktop-file-validate packaging/org.alternativeinterface.dasher.desktop

      - name: Validate AppStream metainfo
        run: appstreamcli validate --no-net packaging/org.alternativeinterface.dasher.metainfo.xml

      # Version drift gate (RFC 0016): the app reports a git-derived version,
      # so nothing forces a tag to match the metainfo's latest <release>. On
      # v* tag pushes this fails the release early if they disagree; on branch
      # builds it only warns (the newest tag may simply be ahead of docs while
      # work continues).
      # Freshness gate at PUSH time (moved from the publish release job,
      # which runs it after ~30 min of artifact builds — by then a perfectly
      # valid tag would be rejected just because main advanced during the
      # build; review finding). Our release process tags merged main, so a
      # tag pointing anywhere else is a stale-local-main mistake. Failing
      # here, within a minute of the push, makes delete-and-re-push cheap.
      - name: Check tag freshness (tag == origin/main tip)
        # Push-only, matching publish.yml's tag-sanity gate: dispatches
        # against existing tags are deliberate rebuilds and must not warn.
        if: github.event_name == 'push' && github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
        run: |
          set -e
          git fetch origin main --quiet
          tip="$(git rev-parse origin/main)"
          echo "tagged: $GITHUB_SHA  origin/main: $tip"
          if [ "$GITHUB_SHA" != "$tip" ]; then
            echo "::error::Tag does not point at origin/main's tip — stale local main? Delete the tag and re-tag on current main (Scripts/tag-release.sh --push verifies this)."
            exit 1
          fi

      - name: Check version consistency (tag ↔ metainfo)
        run: |
          set -e
          describe="$(git describe --tags --match 'v*' 2>/dev/null || true)"
          [ -n "$describe" ] || { echo "No v* tag reachable — skipping"; exit 0; }
          tag_version="${describe%%-*}"; tag_version="${tag_version#v}"
          meta_version="$(grep -m1 -oP '(?<=<release version=")[^"]+' packaging/org.alternativeinterface.dasher.metainfo.xml)"
          echo "git: $tag_version  metainfo: $meta_version"
          if [ "$tag_version" != "$meta_version" ]; then
            if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
              echo "::error::Tag v$tag_version does not match the newest metainfo <release> ($meta_version). Add the release entry when tagging."
              exit 1
            else
              echo "::warning::Newest v* tag (v$tag_version) is ahead of the metainfo's newest <release> ($meta_version) — add the entry when tagging."
            fi
          fi
