---
app-id: org.alternativeinterface.dasher
runtime: org.gnome.Platform
runtime-version: '51'
sdk: org.gnome.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: dasher

finish-args:
  - --socket=fallback-x11
  - --socket=wayland
  # GtkApplication registers its application id on the session bus at
  # startup; without the right to own that name the app aborts with
  # "Failed to register: ... ServiceUnknown". The id set in src/main.cpp is
  # org.dasher.gtk, not the Flatpak app-id (which an app may always own), so
  # it is granted by name. Nothing else in the app talks to the session bus
  # beyond the a11y names below and the portals, which every Flatpak app can
  # reach, so the full --socket=session-bus is not needed.
  - --own-name=org.dasher.gtk
  - --share=ipc
  # Joysticks, gamepads and switch interfaces: SDL opens them under
  # /dev/input (src/Input/InputManager.cpp). --device=input would be the
  # narrow permission, but it needs Flatpak 1.15.6 or newer and the older
  # releases some distros still ship do not understand it, so --device=all
  # stays.
  - --device=all
  # Speech output. The in-process player (rust-tts-wrapper `speaker`, cpal
  # on ALSA) opens the default ALSA device, which in the runtime is the
  # PulseAudio plugin; that needs the sound server socket (PipeWire's
  # pipewire-pulse included). --device=all alone only exposes the raw
  # /dev/snd nodes and the default device fails with "Connection refused".
  - --socket=pulseaudio
  - --talk-name=org.a11y.Bus
  - --talk-name=org.a11y.*
  - --filesystem=home

cleanup:
  - /include
  - /lib/pkgconfig
  - /share/pkgconfig
  - /share/aclocal
  - /share/man
  - /share/gtk-doc
  - /share/doc
  - '*.la'
  - '*.a'

modules:
  # ─── C++ binding chain for gtkmm ──────────────────────────────────────
  # The GNOME runtime ships GTK/glib/pango (C) but not their C++ bindings, so
  # the mm stack is built from source. These versions MUST track the runtime:
  # runtime-version 51 ships GTK 4.24.1 / glib 2.90.1 / pango 1.58.2 / cairo
  # 1.18.6, hence gtkmm 4.24 / glibmm 2.90 / pangomm 2.58 / cairomm 1.18.
  # Bumping runtime-version means bumping these too: gtkmm wraps the newest
  # API of its GTK series and an older one will not compile against a newer
  # GTK. To see what a runtime ships:
  #   flatpak run --command=pkg-config org.gnome.Sdk//51 --modversion \
  #     gtk4 glib-2.0 pango cairo
  # GNOME 51 is based on freedesktop 26.08, so flatpak-builder takes the
  # rust-stable SDK extension from its 26.08 branch.
  - name: mm-common
    buildsystem: meson
    cleanup:
      - '*'
    sources:
      - type: archive
        url: https://download.gnome.org/sources/mm-common/1.0/mm-common-1.0.7.tar.xz
        sha256: 494abfce781418259b1e9d8888c73af4de4b6f3be36cc75d9baa8baa0f2a7a39

  - name: libsigc++
    buildsystem: meson
    config-opts:
      - -Dbuild-examples=false
      - -Dbuild-tests=false
    cleanup:
      - /lib/sigc++-3.0
    sources:
      - type: archive
        url: https://download.gnome.org/sources/libsigc++/3.6/libsigc++-3.6.0.tar.xz
        sha256: c3d23b37dfd6e39f2e09f091b77b1541fbfa17c4f0b6bf5c89baef7229080e17

  - name: glibmm
    buildsystem: meson
    config-opts:
      - --wrap-mode=nodownload
    sources:
      - type: archive
        url: https://download.gnome.org/sources/glibmm/2.90/glibmm-2.90.0.tar.xz
        sha256: e2efa45643f16b9fea2d6299f2f403d672eaeacddf0ff7f8094e1af9b0f5980b
      - type: archive
        url: https://download.gnome.org/sources/libsigc++/3.6/libsigc++-3.6.0.tar.xz
        sha256: c3d23b37dfd6e39f2e09f091b77b1541fbfa17c4f0b6bf5c89baef7229080e17
        dest: subprojects/libsigcplusplus

  - name: cairomm
    buildsystem: meson
    config-opts:
      - --wrap-mode=nodownload
    sources:
      - type: archive
        url: https://www.cairographics.org/releases/cairomm-1.18.0.tar.xz
        # cairographics.org went dark for days in Aug 2026 (connection
        # timeouts, repo-wide) — flatpak-builder falls back to mirror-urls
        # when the primary host fails. The pkgsrc CDN copy is byte-identical
        # (sha256 above). GNOME's mirror only carries cairomm <= 1.15.
        mirror-urls:
          - https://cdn.netbsd.org/pub/pkgsrc/distfiles/cairomm-1.18.0.tar.xz
        sha256: b81255394e3ea8e8aa887276d22afa8985fc8daef60692eb2407d23049f03cfb
      - type: archive
        url: https://download.gnome.org/sources/libsigc++/3.6/libsigc++-3.6.0.tar.xz
        sha256: c3d23b37dfd6e39f2e09f091b77b1541fbfa17c4f0b6bf5c89baef7229080e17
        dest: subprojects/libsigcplusplus

  - name: pangomm
    buildsystem: meson
    config-opts:
      - --wrap-mode=nodownload
    sources:
      - type: archive
        url: https://download.gnome.org/sources/pangomm/2.58/pangomm-2.58.0.tar.xz
        sha256: 217514c1a65035c2fce6e69e33b0d92bafa2594cc474e995a4473441b10f3a33
      - type: archive
        url: https://download.gnome.org/sources/libsigc++/3.6/libsigc++-3.6.0.tar.xz
        sha256: c3d23b37dfd6e39f2e09f091b77b1541fbfa17c4f0b6bf5c89baef7229080e17
        dest: subprojects/libsigcplusplus
      - type: archive
        url: https://www.cairographics.org/releases/cairomm-1.18.0.tar.xz
        # cairographics.org went dark for days in Aug 2026 (connection
        # timeouts, repo-wide) — flatpak-builder falls back to mirror-urls
        # when the primary host fails. The pkgsrc CDN copy is byte-identical
        # (sha256 above). GNOME's mirror only carries cairomm <= 1.15.
        mirror-urls:
          - https://cdn.netbsd.org/pub/pkgsrc/distfiles/cairomm-1.18.0.tar.xz
        sha256: b81255394e3ea8e8aa887276d22afa8985fc8daef60692eb2407d23049f03cfb
        dest: subprojects/cairomm
      - type: archive
        url: https://download.gnome.org/sources/glibmm/2.90/glibmm-2.90.0.tar.xz
        sha256: e2efa45643f16b9fea2d6299f2f403d672eaeacddf0ff7f8094e1af9b0f5980b
        dest: subprojects/glibmm

  - name: gtkmm
    buildsystem: meson
    config-opts:
      - --wrap-mode=nodownload
    sources:
      - type: archive
        url: https://download.gnome.org/sources/gtkmm/4.24/gtkmm-4.24.0.tar.xz
        sha256: 7fd9cea356e7d3b74bf7d2a51d7e0e6763f3f9f1cddc5e77c8b0b5b7fa9d5e5a
      - type: archive
        url: https://download.gnome.org/sources/libsigc++/3.6/libsigc++-3.6.0.tar.xz
        sha256: c3d23b37dfd6e39f2e09f091b77b1541fbfa17c4f0b6bf5c89baef7229080e17
        dest: subprojects/libsigcplusplus
      - type: archive
        url: https://www.cairographics.org/releases/cairomm-1.18.0.tar.xz
        # cairographics.org went dark for days in Aug 2026 (connection
        # timeouts, repo-wide) — flatpak-builder falls back to mirror-urls
        # when the primary host fails. The pkgsrc CDN copy is byte-identical
        # (sha256 above). GNOME's mirror only carries cairomm <= 1.15.
        mirror-urls:
          - https://cdn.netbsd.org/pub/pkgsrc/distfiles/cairomm-1.18.0.tar.xz
        sha256: b81255394e3ea8e8aa887276d22afa8985fc8daef60692eb2407d23049f03cfb
        dest: subprojects/cairomm
      - type: archive
        url: https://download.gnome.org/sources/glibmm/2.90/glibmm-2.90.0.tar.xz
        sha256: e2efa45643f16b9fea2d6299f2f403d672eaeacddf0ff7f8094e1af9b0f5980b
        dest: subprojects/glibmm
      - type: archive
        url: https://download.gnome.org/sources/pangomm/2.58/pangomm-2.58.0.tar.xz
        sha256: 217514c1a65035c2fce6e69e33b0d92bafa2594cc474e995a4473441b10f3a33
        dest: subprojects/pangomm

  # ─── Dasher-GTK (builds DasherCore + SDL3 + TTS + app together) ───────
  # Note: Flatpak uses cloud-only TTS (no speech-dispatcher) to avoid
  # building dotconf/libspeechd in the sandbox. AppImage has full system TTS.
  - name: dasher
    buildsystem: simple
    build-options:
      append-path: /usr/lib/sdk/rust-stable/bin
      # No network at build time (a Flathub requirement, and what makes the
      # build reproducible): every crate is vendored through
      # cargo-sources.json into $CARGO_HOME/vendor, and cargo is told to
      # stay offline. See the sources below for how to regenerate.
      env:
        CARGO_HOME: /run/build/dasher/cargo
        CARGO_NET_OFFLINE: 'true'
        # sherpa-onnx-sys' build script downloads the k2-fsa prebuilt
        # static libs unless it finds the archive in this directory (it
        # looks for sherpa-onnx-v<version>-linux-<arch>-static-lib.tar.bz2).
        # The archives are declared as checksummed sources below.
        SHERPA_ONNX_ARCHIVE_DIR: /run/build/dasher/sherpa-onnx-archives
        # FLATPAK_ARCH is x86_64 / aarch64 depending on the leg. The C++ mm
        # bindings install their .pc files under the multiarch triplet dir,
        # so PKG_CONFIG_PATH has to follow the build arch.
        PKG_CONFIG_PATH: /app/lib64/pkgconfig:/app/lib/pkgconfig:/app/lib/${FLATPAK_ARCH}-linux-gnu/pkgconfig:/app/share/pkgconfig
    build-commands:
      # sherpaonnx is bundled (models download at runtime into the
      # sandboxed home; sherpa-g2p fetches voicegarden lexicon bundles
      # for non-English voices); `system` stays off — the
      # speech-dispatcher socket is not exported in finish-args.
      # `speaker` = in-process cpal playback (rust-tts-wrapper #139);
      # the GNOME SDK ships alsa-lib, and at runtime the default ALSA
      # device reaches the sound server through --socket=pulseaudio in
      # finish-args.
      - cmake -B _build -DCMAKE_BUILD_TYPE=Release -DTTS_WRAPPER_FEATURES=cloud,sherpaonnx,sherpa-g2p,speaker -DBUILD_GTK_TESTS=OFF -DCMAKE_INSTALL_PREFIX=/app .
      - cmake --build _build -j$(nproc)
      - cmake --install _build
    post-install:
      - install -Dm644 packaging/org.alternativeinterface.dasher.desktop /app/share/applications/org.alternativeinterface.dasher.desktop
      - install -Dm644 packaging/org.alternativeinterface.dasher.metainfo.xml /app/share/metainfo/org.alternativeinterface.dasher.metainfo.xml
      - install -Dm644 Resources/icon.png /app/share/icons/hicolor/48x48/apps/org.alternativeinterface.dasher.png
      - install -Dm644 DasherCore/Data/dasher.svg /app/share/icons/hicolor/scalable/apps/org.alternativeinterface.dasher.svg
      # The app installs as a portable dir at /app (binary + libdasher.so), and
      # the gtkmm C++ stack builds into /app/lib64 (flatpak only searches
      # /app/lib). Flatpak's `command: dasher` resolves via /app/bin, so add a
      # launcher there that puts both dirs on the library path (covers the
      # transitive mm deps, which an rpath alone would not) and execs the binary.
      - |
        install -d /app/bin
        printf '%s\n' '#!/bin/sh' 'export LD_LIBRARY_PATH="/app:/app/lib64${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"' 'exec /app/dasher "$@"' > /app/bin/dasher
        chmod +x /app/bin/dasher
    sources:
      # Build the checked-out working tree (the PR's own code), NOT a re-clone
      # of a hardcoded branch. Re-cloning meant fork PRs built upstream's C++
      # and frontend changes here were never actually tested by the Flatpak job.
      # Path is relative to this manifest (packaging/flatpak/ -> repo root).
      - type: dir
        path: ../..
      # Remove the (empty) submodule dirs and git metadata so the separate git
      # sources below can clone DasherCore / SDL / rust-tts-wrapper cleanly.
      - type: shell
        commands:
          - rm -rf DasherCore Thirdparty rust-tts-wrapper .gitmodules .git
      # Pinned to the commit Dasher-GTK's DasherCore submodule points at, so
      # the Flatpak builds the same core as every other leg (a floating
      # `branch: main` is neither reproducible nor accepted by Flathub).
      # Scripts/check-flatpak-pins.py fails the PR when the two drift apart.
      - type: git
        url: https://github.com/dasher-project/DasherCore.git
        commit: ec9aa2dbbbc3ad6b7d625fb01679268e418c7ef3
        dest: DasherCore
      # tag + commit: flatpak-builder verifies the tag still resolves to this
      # commit, so a moved upstream tag fails the build instead of silently
      # changing what is compiled.
      - type: git
        url: https://github.com/libsdl-org/SDL.git
        tag: release-3.2.30
        commit: f5e5f6588921eed3d7d048ce43d9eb1ff0da0ffc
        dest: Thirdparty/SDL
      # Pinned to the commit Dasher-GTK's submodule points at: v1.16.2
      # (Sherpa-ONNX 2, model installer, pronunciations #125/#131,
      # in-process playback #139/#140). Follow the submodule pin in
      # .gitmodules when bumping.
      - type: git
        url: https://github.com/AACTools/rust-tts-wrapper.git
        commit: f8d487878288a79eec17fb7db69cfaccea41f4ac
        dest: rust-tts-wrapper
      # ─── Offline cargo inputs for rust-tts-wrapper ───────────────────
      # rust-tts-wrapper does not commit a Cargo.lock (it is gitignored
      # upstream), so the lock that fixes the crate versions lives here and
      # is dropped into the checkout; cargo-sources.json is generated from
      # it and vendors exactly those crates. rust-tts-wrapper-Cargo.lock.commit
      # records the rust-tts-wrapper commit the lock was generated for;
      # Scripts/check-flatpak-pins.py fails while it is not the pin above,
      # because dependencies can change without the crate version changing.
      # Regenerate ALL THREE whenever the rust-tts-wrapper pin above moves
      # (from the repo root, with the submodule checked out at the new
      # commit):
      #   cargo generate-lockfile --manifest-path rust-tts-wrapper/Cargo.toml
      #   mv rust-tts-wrapper/Cargo.lock packaging/flatpak/rust-tts-wrapper-Cargo.lock
      #   git -C rust-tts-wrapper rev-parse HEAD \
      #     > packaging/flatpak/rust-tts-wrapper-Cargo.lock.commit
      #   python3 flatpak-cargo-generator.py \
      #     packaging/flatpak/rust-tts-wrapper-Cargo.lock \
      #     -o packaging/flatpak/cargo-sources.json
      # (flatpak-cargo-generator.py: github.com/flatpak/flatpak-builder-tools,
      # cargo/ directory.) Never edit the .commit file by hand to get the
      # check green: it must name the commit the lock really came from.
      - type: file
        path: rust-tts-wrapper-Cargo.lock
        dest: rust-tts-wrapper
        dest-filename: Cargo.lock
      - cargo-sources.json
      # Prebuilt sherpa-onnx static libs (sherpa + onnxruntime), the same
      # archives sherpa-onnx-sys would otherwise download in its build
      # script. The version in the file name must match the sherpa-onnx-sys
      # version in rust-tts-wrapper-Cargo.lock (rust-tts-wrapper pins
      # sherpa-onnx with `=`); bump url + sha256 together with it.
      - type: file
        only-arches: [x86_64]
        url: https://github.com/k2-fsa/sherpa-onnx/releases/download/v2.0.1/sherpa-onnx-v2.0.1-linux-x64-static-lib.tar.bz2
        sha256: 55cfadf65ba50d0afc1a802b7a337942819e51c94a5b5a384def1978f7c70871
        dest: sherpa-onnx-archives
      - type: file
        only-arches: [aarch64]
        url: https://github.com/k2-fsa/sherpa-onnx/releases/download/v2.0.1/sherpa-onnx-v2.0.1-linux-aarch64-static-lib.tar.bz2
        sha256: b6c6090e40fd18d6812f04fe21260602cd1223d7b5e83ad39dab87ad7c1c031d
        dest: sherpa-onnx-archives
