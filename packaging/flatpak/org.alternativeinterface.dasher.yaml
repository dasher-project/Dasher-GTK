---
app-id: org.alternativeinterface.dasher
runtime: org.gnome.Platform
runtime-version: '51'
sdk: org.gnome.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: dasher

finish-args:
  - --socket=fallback-x11
  - --socket=wayland
  # GtkApplication registers its application id on the session bus at
  # startup; without the right to own that name the app aborts with
  # "Failed to register: ... ServiceUnknown". The id set in src/main.cpp is
  # org.dasher.gtk, not the Flatpak app-id (which an app may always own), so
  # it is granted by name. Nothing else in the app talks to the session bus
  # beyond the a11y names below and the portals, which every Flatpak app can
  # reach, so the full --socket=session-bus is not needed.
  - --own-name=org.dasher.gtk
  - --share=ipc
  # Network at runtime (the build itself stays offline). The cloud speech
  # engines call their providers' APIs, and the Sherpa voices (models and
  # the lexicon bundles for non-English ones) are downloaded on demand;
  # without this the sandbox has no routes and no DNS and both fail. The
  # analytics and crash-report upload uses it too: that is opt-in, off by
  # default, and sends nothing until it is enabled under Preferences ->
  # Privacy. The update check is not affected (it is disabled in Flatpak).
  - --share=network
  # Joysticks, gamepads and switch interfaces: SDL opens them under
  # /dev/input (src/Input/InputManager.cpp). --device=input would be the
  # narrow permission, but it needs Flatpak 1.15.6 or newer and the older
  # releases some distros still ship do not understand it, so --device=all
  # stays.
  - --device=all
  # Speech output. The in-process player (rust-tts-wrapper `speaker`, cpal
  # on ALSA) opens the default ALSA device, which in the runtime is the
  # PulseAudio plugin; that needs the sound server socket (PipeWire's
  # pipewire-pulse included). --device=all alone only exposes the raw
  # /dev/snd nodes and the default device fails with "Connection refused".
  - --socket=pulseaudio
  - --talk-name=org.a11y.Bus
  - --talk-name=org.a11y.*
  - --filesystem=home

cleanup:
  - /include
  - /lib/pkgconfig
  - /share/pkgconfig
  - /share/aclocal
  - /share/man
  - /share/gtk-doc
  - /share/doc
  - '*.la'
  - '*.a'
  # Build-time prefix of the from-source speech libraries (static archives
  # and headers that end up inside librust_tts_wrapper.so).
  - /sherpa-onnx

modules:
  # ─── C++ binding chain for gtkmm ──────────────────────────────────────
  # The GNOME runtime ships GTK/glib/pango (C) but not their C++ bindings, so
  # the mm stack is built from source. These versions MUST track the runtime:
  # runtime-version 51 ships GTK 4.24.1 / glib 2.90.1 / pango 1.58.2 / cairo
  # 1.18.6, hence gtkmm 4.24 / glibmm 2.90 / pangomm 2.58 / cairomm 1.18.
  # Bumping runtime-version means bumping these too: gtkmm wraps the newest
  # API of its GTK series and an older one will not compile against a newer
  # GTK. To see what a runtime ships:
  #   flatpak run --command=pkg-config org.gnome.Sdk//51 --modversion \
  #     gtk4 glib-2.0 pango cairo
  # GNOME 51 is based on freedesktop 26.08, so flatpak-builder takes the
  # rust-stable SDK extension from its 26.08 branch.
  - name: mm-common
    buildsystem: meson
    cleanup:
      - '*'
    sources:
      - type: archive
        url: https://download.gnome.org/sources/mm-common/1.0/mm-common-1.0.7.tar.xz
        sha256: 494abfce781418259b1e9d8888c73af4de4b6f3be36cc75d9baa8baa0f2a7a39

  - name: libsigc++
    buildsystem: meson
    config-opts:
      - -Dbuild-examples=false
      - -Dbuild-tests=false
    cleanup:
      - /lib/sigc++-3.0
    sources:
      - type: archive
        url: https://download.gnome.org/sources/libsigc++/3.6/libsigc++-3.6.0.tar.xz
        sha256: c3d23b37dfd6e39f2e09f091b77b1541fbfa17c4f0b6bf5c89baef7229080e17

  - name: glibmm
    buildsystem: meson
    config-opts:
      - --wrap-mode=nodownload
    sources:
      - type: archive
        url: https://download.gnome.org/sources/glibmm/2.90/glibmm-2.90.0.tar.xz
        sha256: e2efa45643f16b9fea2d6299f2f403d672eaeacddf0ff7f8094e1af9b0f5980b
      - type: archive
        url: https://download.gnome.org/sources/libsigc++/3.6/libsigc++-3.6.0.tar.xz
        sha256: c3d23b37dfd6e39f2e09f091b77b1541fbfa17c4f0b6bf5c89baef7229080e17
        dest: subprojects/libsigcplusplus

  - name: cairomm
    buildsystem: meson
    config-opts:
      - --wrap-mode=nodownload
    sources:
      - type: archive
        url: https://www.cairographics.org/releases/cairomm-1.18.0.tar.xz
        # cairographics.org went dark for days in Aug 2026 (connection
        # timeouts, repo-wide) — flatpak-builder falls back to mirror-urls
        # when the primary host fails. The pkgsrc CDN copy is byte-identical
        # (sha256 above). GNOME's mirror only carries cairomm <= 1.15.
        mirror-urls:
          - https://cdn.netbsd.org/pub/pkgsrc/distfiles/cairomm-1.18.0.tar.xz
        sha256: b81255394e3ea8e8aa887276d22afa8985fc8daef60692eb2407d23049f03cfb
      - type: archive
        url: https://download.gnome.org/sources/libsigc++/3.6/libsigc++-3.6.0.tar.xz
        sha256: c3d23b37dfd6e39f2e09f091b77b1541fbfa17c4f0b6bf5c89baef7229080e17
        dest: subprojects/libsigcplusplus

  - name: pangomm
    buildsystem: meson
    config-opts:
      - --wrap-mode=nodownload
    sources:
      - type: archive
        url: https://download.gnome.org/sources/pangomm/2.58/pangomm-2.58.0.tar.xz
        sha256: 217514c1a65035c2fce6e69e33b0d92bafa2594cc474e995a4473441b10f3a33
      - type: archive
        url: https://download.gnome.org/sources/libsigc++/3.6/libsigc++-3.6.0.tar.xz
        sha256: c3d23b37dfd6e39f2e09f091b77b1541fbfa17c4f0b6bf5c89baef7229080e17
        dest: subprojects/libsigcplusplus
      - type: archive
        url: https://www.cairographics.org/releases/cairomm-1.18.0.tar.xz
        # cairographics.org went dark for days in Aug 2026 (connection
        # timeouts, repo-wide) — flatpak-builder falls back to mirror-urls
        # when the primary host fails. The pkgsrc CDN copy is byte-identical
        # (sha256 above). GNOME's mirror only carries cairomm <= 1.15.
        mirror-urls:
          - https://cdn.netbsd.org/pub/pkgsrc/distfiles/cairomm-1.18.0.tar.xz
        sha256: b81255394e3ea8e8aa887276d22afa8985fc8daef60692eb2407d23049f03cfb
        dest: subprojects/cairomm
      - type: archive
        url: https://download.gnome.org/sources/glibmm/2.90/glibmm-2.90.0.tar.xz
        sha256: e2efa45643f16b9fea2d6299f2f403d672eaeacddf0ff7f8094e1af9b0f5980b
        dest: subprojects/glibmm

  - name: gtkmm
    buildsystem: meson
    config-opts:
      - --wrap-mode=nodownload
    sources:
      - type: archive
        url: https://download.gnome.org/sources/gtkmm/4.24/gtkmm-4.24.0.tar.xz
        sha256: 7fd9cea356e7d3b74bf7d2a51d7e0e6763f3f9f1cddc5e77c8b0b5b7fa9d5e5a
      - type: archive
        url: https://download.gnome.org/sources/libsigc++/3.6/libsigc++-3.6.0.tar.xz
        sha256: c3d23b37dfd6e39f2e09f091b77b1541fbfa17c4f0b6bf5c89baef7229080e17
        dest: subprojects/libsigcplusplus
      - type: archive
        url: https://www.cairographics.org/releases/cairomm-1.18.0.tar.xz
        # cairographics.org went dark for days in Aug 2026 (connection
        # timeouts, repo-wide) — flatpak-builder falls back to mirror-urls
        # when the primary host fails. The pkgsrc CDN copy is byte-identical
        # (sha256 above). GNOME's mirror only carries cairomm <= 1.15.
        mirror-urls:
          - https://cdn.netbsd.org/pub/pkgsrc/distfiles/cairomm-1.18.0.tar.xz
        sha256: b81255394e3ea8e8aa887276d22afa8985fc8daef60692eb2407d23049f03cfb
        dest: subprojects/cairomm
      - type: archive
        url: https://download.gnome.org/sources/glibmm/2.90/glibmm-2.90.0.tar.xz
        sha256: e2efa45643f16b9fea2d6299f2f403d672eaeacddf0ff7f8094e1af9b0f5980b
        dest: subprojects/glibmm
      - type: archive
        url: https://download.gnome.org/sources/pangomm/2.58/pangomm-2.58.0.tar.xz
        sha256: 217514c1a65035c2fce6e69e33b0d92bafa2594cc474e995a4473441b10f3a33
        dest: subprojects/pangomm

  # ─── Local speech: ONNX Runtime + sherpa-onnx, built from source ──────
  # rust-tts-wrapper's `sherpaonnx` feature links the sherpa-onnx C API
  # statically through the sherpa-onnx-sys crate. Left alone, that crate
  # downloads k2-fsa's prebuilt static archives (sherpa-onnx plus a
  # prebuilt ONNX Runtime); Flathub wants everything built from source, so
  # the two modules below build the same libraries here and the dasher
  # module points the crate at them with SHERPA_ONNX_LIB_DIR.
  #
  # Versions are not free: sherpa-onnx must be the release of the locked
  # sherpa-onnx-sys crate (packaging/flatpak/rust-tts-wrapper-Cargo.lock),
  # and ONNX Runtime must be the release that sherpa-onnx is built against
  # upstream (cmake/onnxruntime-linux-*-static.cmake in sherpa-onnx).
  # Scripts/check-flatpak-pins.py checks both, and that the dependency
  # tarballs sherpa-onnx pins are sources here.
  #
  # Everything lands in /app/sherpa-onnx, a build-time prefix that the
  # cleanup list removes: the code ends up inside librust_tts_wrapper.so.
  - name: onnxruntime
    buildsystem: simple
    build-options:
      # No debug info for this module: it only multiplies the size of the
      # static archives (the prebuilt ones it replaces had none either).
      cflags: -g0
      cxxflags: -g0
    build-commands:
      # The version this module is meant to build; check-flatpak-pins.py
      # reads it from this line and compares it with what sherpa-onnx pins.
      - test "$(cat VERSION_NUMBER)" = 1.28.2
      # A static, CPU-only build with onnxruntime's default feature set,
      # like the archive it replaces. Dependencies come from the mirror/
      # directory below, never from find_package (the SDK's abseil is a
      # different release) and never from the network.
      # --compile-no-warning-as-error: onnxruntime builds its own code with
      # -Werror and GCC 16 reports a false maybe-uninitialized in
      # core/optimizer/matmul_nbits_fusion.cc.
      - cmake -S cmake -B _build -G Ninja --compile-no-warning-as-error
        -DCMAKE_BUILD_TYPE=Release
        -DCMAKE_POSITION_INDEPENDENT_CODE=ON
        -Donnxruntime_BUILD_SHARED_LIB=OFF
        -Donnxruntime_BUILD_UNIT_TESTS=OFF
        -DFETCHCONTENT_TRY_FIND_PACKAGE_MODE=NEVER
      # re2 is named because a static build never links anything, so the
      # default target does not build this one dependency.
      - cmake --build _build --target all re2
      # sherpa-onnx-sys links a single libonnxruntime.a (that is what the
      # upstream archive ships), so merge onnxruntime's own static libraries
      # and the ones of its dependencies into one archive. protoc and the
      # full libprotobuf are build tools only (onnxruntime links
      # libprotobuf-lite) and stay out.
      - |
        set -e
        mkdir -p /app/sherpa-onnx/lib /app/sherpa-onnx/include/onnxruntime
        {
          echo "create /app/sherpa-onnx/lib/libonnxruntime.a"
          find _build -name '*.a' ! -name libprotobuf.a ! -name libprotoc.a | LC_ALL=C sort | sed 's/^/addlib /'
          echo save
          echo end
        } > _build/merge.mri
        ar -M < _build/merge.mri
        cmake --install _build --prefix "$PWD/_install"
        cp -a _install/include/onnxruntime/. /app/sherpa-onnx/include/onnxruntime/
      # Link and run a program against the merged archive with exactly the
      # system libraries sherpa-onnx-sys adds. A dependency missing from the
      # archive fails here, not at the end of the cargo build.
      - |
        set -e
        printf '%s\n' '#include <onnxruntime_c_api.h>' 'int main(void) { return OrtGetApiBase()->GetApi(ORT_API_VERSION) == 0; }' > _build/linkcheck.c
        gcc -I/app/sherpa-onnx/include/onnxruntime _build/linkcheck.c -o _build/linkcheck -L/app/sherpa-onnx/lib -lonnxruntime -lstdc++ -lm -lpthread -ldl -Wl,-z,noexecstack
        _build/linkcheck
    post-install:
      # Licence texts. libonnxruntime.a carries protobuf, abseil, re2, onnx
      # and the other dependencies with it, and all of that ends up inside
      # librust_tts_wrapper.so; ThirdPartyNotices.txt is upstream's
      # collection of their notices. flatpak-builder 1.4.5 and newer copies
      # LICENSE by itself, before post-install; an older one (Ubuntu 24.04,
      # which the publish workflow uses, has 1.4.2) copies nothing and does
      # not know `license-files`, hence a command that fills in what is not
      # there yet.
      - |
        set -e
        dest="/app/share/licenses/${FLATPAK_ID}/onnxruntime"
        for f in LICENSE ThirdPartyNotices.txt; do
          [ -e "$dest/$f" ] || install -Dm644 "$f" "$dest/$f"
        done
    sources:
      # ONNX Runtime v1.28.2 is commit 33ca9628 (the upstream prebuilt
      # archive reports the same commit in its build info). The source is
      # GitHub's tarball of that commit.
      # ONNX Runtime is maintained (1.32.0 was published on PyPI and NuGet
      # on 13 November 2026), but the microsoft/onnxruntime repository on
      # GitHub has returned 404 since about 17 November 2026, cause
      # unannounced, and there is no official source location right now.
      # flatpak-builder tries mirror-urls in order when the primary fails:
      # - pykeio/onnxruntime, a temporary mirror by the maintainers of the
      #   `ort` crate, has the tag v1.28.2 on this commit, and its tarball
      #   is the file pinned below.
      # - intel/onnxruntime is a further fallback. No branch or tag of it
      #   contains the commit; GitHub serves it only from the fork
      #   network's shared storage, so nothing guarantees it stays.
      # The tarball's top directory is <repository name>-<commit>, so a
      # copy under another repository name is a different file. The sha256
      # guarantees that whichever URL answers gives the same content. When
      # an official repository is back, point url at it.
      - type: archive
        url: https://github.com/microsoft/onnxruntime/archive/33ca9628233dc8f002435e868d4c2e9f82766ca1.tar.gz
        mirror-urls:
          - https://github.com/pykeio/onnxruntime/archive/33ca9628233dc8f002435e868d4c2e9f82766ca1.tar.gz
          - https://github.com/intel/onnxruntime/archive/33ca9628233dc8f002435e868d4c2e9f82766ca1.tar.gz
        sha256: 889281e9b54b65664b1628fa28bab05b1238f388ad30c179dbe5bc15655a7532
      # onnxruntime's cmake fetches its dependencies from the URLs in
      # cmake/deps.txt and checks their SHA1. It first looks for each one
      # under mirror/<url without https://>, so the files are placed there:
      # the versions, and the patches onnxruntime applies to them, are
      # exactly upstream's. When moving to another onnxruntime release, redo
      # this list from that release's cmake/deps.txt (a configure with a
      # missing file names it).
      - type: file
        url: https://github.com/abseil/abseil-cpp/archive/refs/tags/20250814.0.zip
        sha256: b2bdcf6682d8cb53df365bcc5d6c318a22e55821d9978a10fdb61404c026daff
        dest: mirror/github.com/abseil/abseil-cpp/archive/refs/tags
        dest-filename: 20250814.0.zip
      - type: file
        url: https://github.com/google/re2/archive/refs/tags/2024-07-02.zip
        sha256: a835fe55fbdcd8e80f38584ab22d0840662c67f2feb36bd679402da9641dc71e
        dest: mirror/github.com/google/re2/archive/refs/tags
        dest-filename: 2024-07-02.zip
      - type: file
        url: https://github.com/protocolbuffers/protobuf/archive/refs/tags/v21.12.zip
        sha256: 6a31b662deaeb0ac35e6287bda2f3369b19836e6c9f8828d4da444346f420298
        dest: mirror/github.com/protocolbuffers/protobuf/archive/refs/tags
        dest-filename: v21.12.zip
      - type: file
        url: https://github.com/HowardHinnant/date/archive/refs/tags/v3.0.1.zip
        sha256: f4300b96f7a304d4ef9bf6e0fa3ded72159f7f2d0f605bdde3e030a0dba7cf9f
        dest: mirror/github.com/HowardHinnant/date/archive/refs/tags
        dest-filename: v3.0.1.zip
      - type: file
        url: https://github.com/boostorg/mp11/archive/refs/tags/boost-1.82.0.zip
        sha256: 81431bdc44c439a324e02c07ed067f8f556419fd86f2d8b486ff568df6aac899
        dest: mirror/github.com/boostorg/mp11/archive/refs/tags
        dest-filename: boost-1.82.0.zip
      - type: file
        url: https://github.com/nlohmann/json/archive/refs/tags/v3.11.3.zip
        sha256: 04022b05d806eb5ff73023c280b68697d12b93e1b7267a0b22a1a39ec7578069
        dest: mirror/github.com/nlohmann/json/archive/refs/tags
        dest-filename: v3.11.3.zip
      - type: file
        url: https://github.com/pytorch/cpuinfo/archive/4628dc060ce4e82345dc166bbac875609db4ff69.zip
        sha256: 2ed3ebc6c2656cc0aafc7af319e5cb0f97cc9b415eae180f566def84f1ca6a29
        dest: mirror/github.com/pytorch/cpuinfo/archive
        dest-filename: 4628dc060ce4e82345dc166bbac875609db4ff69.zip
      - type: file
        url: https://github.com/microsoft/GSL/archive/refs/tags/v4.2.1.zip
        sha256: c9291d95f5f6e5c561990d06a589b01d89e553d0f366f0ce723dd1788e7a6076
        dest: mirror/github.com/microsoft/GSL/archive/refs/tags
        dest-filename: v4.2.1.zip
      - type: file
        url: https://github.com/dcleblanc/SafeInt/archive/refs/tags/3.0.28.zip
        sha256: 3ffbd9a2fdff45da77da3e7269e9aa512ea43bed5c38ce8fd8f3d1068a032c3f
        dest: mirror/github.com/dcleblanc/SafeInt/archive/refs/tags
        dest-filename: 3.0.28.zip
      - type: file
        url: https://github.com/google/flatbuffers/archive/refs/tags/v23.5.26.zip
        sha256: 57bd580c0772fd1a726c34ab8bf05325293bc5f9c165060a898afa1feeeb95e1
        dest: mirror/github.com/google/flatbuffers/archive/refs/tags
        dest-filename: v23.5.26.zip
      - type: file
        url: https://github.com/eigen-mirror/eigen/archive/1d8b82b0740839c0de7f1242a3585e3390ff5f33/eigen-1d8b82b0740839c0de7f1242a3585e3390ff5f33.zip
        sha256: 6a60d76351f97132669daeeb721d6bf14b008101883ad2d687a3201c5c461eb0
        dest: mirror/github.com/eigen-mirror/eigen/archive/1d8b82b0740839c0de7f1242a3585e3390ff5f33
        dest-filename: eigen-1d8b82b0740839c0de7f1242a3585e3390ff5f33.zip
      - type: file
        url: https://github.com/onnx/onnx/archive/refs/tags/v1.22.0.zip
        sha256: 8dc1181d33529a1249e031226126d0699ac9bdfc571ee530ee3a12f4656f2be3
        dest: mirror/github.com/onnx/onnx/archive/refs/tags
        dest-filename: v1.22.0.zip

  - name: sherpa-onnx
    buildsystem: cmake-ninja
    builddir: true
    build-options:
      cflags: -g0
      cxxflags: -g0
      env:
        # sherpa-onnx's cmake uses an existing onnxruntime when these are
        # set (cmake/onnxruntime.cmake); with only libonnxruntime.a in the
        # directory it links the static library.
        SHERPA_ONNXRUNTIME_INCLUDE_DIR: /app/sherpa-onnx/include/onnxruntime
        SHERPA_ONNXRUNTIME_LIB_DIR: /app/sherpa-onnx/lib
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DCMAKE_INSTALL_PREFIX=/app/sherpa-onnx
      - -DCMAKE_POSITION_INDEPENDENT_CODE=ON
      # Static libraries with the default feature set (TTS, speaker
      # diarization, C API), as in the upstream static archive; only the
      # command line programs and what they alone need are left out.
      - -DBUILD_SHARED_LIBS=OFF
      - -DSHERPA_ONNX_ENABLE_BINARY=OFF
      - -DSHERPA_ONNX_BUILD_C_API_EXAMPLES=OFF
      - -DSHERPA_ONNX_ENABLE_PORTAUDIO=OFF
      - -DSHERPA_ONNX_ENABLE_WEBSOCKET=OFF
      - -DSHERPA_ONNX_ENABLE_TESTS=OFF
      - -DSHERPA_ONNX_ENABLE_PYTHON=OFF
      - -DSHERPA_ONNX_LINK_LIBSTDCPP_STATICALLY=OFF
    post-install:
      # Licence texts, as for onnxruntime above: sherpa-onnx's own, and
      # those of the dependencies cmake unpacked into _deps/ (this runs in
      # the build directory), all of which are linked statically. Each one
      # gets a directory of its own. A LICENSES/ directory is copied whole
      # (kissfft's COPYING refers to it), so texts for files that are not
      # linked come along too, such as the GPL of a test tool in json. A
      # dependency in which no licence file is found stops the build, so a
      # new one is looked at once.
      - |
        set -e
        dest="/app/share/licenses/${FLATPAK_ID}/sherpa-onnx"
        [ -e "$dest/LICENSE" ] || install -Dm644 ../LICENSE "$dest/LICENSE"
        for src in _deps/*-src; do
          name="$(basename "$src" -src)"
          found=
          for f in "$src"/LICEN[SC]E* "$src"/COPYING* "$src"/LICENSES/*; do
            [ -f "$f" ] || continue
            install -Dm644 "$f" "$dest/$name/${f#"$src"/}"
            found=1
          done
          [ -n "$found" ] || { echo "No licence file found in $src" >&2; exit 1; }
        done
    sources:
      # The tag must be v<version of sherpa-onnx-sys in the cargo lock>.
      - type: git
        url: https://github.com/k2-fsa/sherpa-onnx.git
        tag: v2.0.1
        commit: af2d8d81dbfa61c4cea4c568da78f3982edca005
      # sherpa-onnx's cmake downloads these with FetchContent unless it
      # finds them next to its CMakeLists.txt under exactly these names
      # (see possible_file_locations in its cmake/*.cmake). The sha256
      # values are the ones its cmake files verify. kissfft is fetched by
      # kaldi-native-fbank and kaldifst by kaldi-decoder, the same way.
      - type: file
        url: https://github.com/csukuangfj/kaldi-native-fbank/archive/refs/tags/v1.22.4.tar.gz
        sha256: 257fea639585ca6ee00860493bb9d7ab32488b8a5407ffe434c1f361ea545fae
